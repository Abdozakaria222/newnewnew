name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover -s . -p "test_*.py" -t . -v

      - name: Build EXE
        run: |
          python -m pip install pyinstaller
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name NetworkOptimizer --add-data "netoptimizer/ui/static;netoptimizer/ui/static" --add-data "netoptimizer/data;netoptimizer/data" launcher.py

      - name: Upload EXE (Actions artifact)
        uses: actions/upload-artifact@v4
        with:
          name: NetworkOptimizer-exe
          path: dist/NetworkOptimizer.exe

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: NetworkOptimizer build ${{ github.run_number }}
          files: dist/NetworkOptimizer.exe
