<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NetworkOptimizer</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%228%22 cy=%228%22 r=%226%22 fill=%22%233fb6a8%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand"><span class="logo">◉</span><div><b>NetworkOptimizer</b><small id="ver"></small></div></div>
    <nav id="nav">
      <a data-page="dashboard" data-i18n="nav_dashboard"></a>
      <a data-page="dns" data-i18n="nav_dns"></a>
      <a data-page="mtu" data-i18n="nav_mtu"></a>
      <a data-page="compare" data-i18n="nav_compare"></a>
      <a data-page="profiles" data-i18n="nav_profiles"></a>
      <a data-page="backup" data-i18n="nav_backup"></a>
      <a data-page="tools" data-i18n="nav_tools"></a>
      <a data-page="providers" data-i18n="nav_providers"></a>
      <a data-page="settings" data-i18n="nav_settings"></a>
      <a data-page="log" data-i18n="nav_log"></a>
    </nav>
    <div class="side-foot">
      <button class="ghost" id="langBtn"></button>
      <button class="ghost" id="themeBtn">☾ / ☀</button>
    </div>
  </aside>
  <main>
    <div id="banner"></div>
    <div id="jobbar" class="jobbar hidden">
      <div class="jobtext"><b id="jobKind"></b> <span id="jobMsg"></span></div>
      <div class="progress"><div id="jobProg"></div></div>
      <button class="danger small" id="jobCancel" data-i18n="cancel"></button>
    </div>
    <section id="page"></section>
  </main>
</div>
<div id="modal" class="modal hidden"><div class="modal-box">
  <h3 id="modalTitle"></h3><div id="modalBody"></div>
  <div class="modal-actions"><button id="modalOk" class="primary"></button><button id="modalCancel" class="ghost"></button></div>
</div></div>
<div id="toasts"></div>
<div id="tip" class="tip hidden"></div>
<script src="i18n.js"></script>
<script src="charts.js"></script>
<script src="app.js"></script>
</body>
</html>
